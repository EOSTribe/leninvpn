name: 'Release Android'

# Triggers when you push a version tag, e.g.: git tag v4.8.15.3 && git push origin v4.8.15.3
on:
  push:
    tags:
      - 'v*.*.*.*'

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/
  QT_VERSION: 6.10.1
  QT_MODULES: 'qtremoteobjects qt5compat qtimageformats qtshadertools'
  ANDROID_BUILD_PLATFORM: android-36

jobs:
  build-and-release:
    name: 'Build & Release Android APKs'
    runs-on: android-runner

    steps:
      # ── Qt ──────────────────────────────────────────────────────────────────
      - name: 'Install desktop Qt (host tools)'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}
          py7zrversion: '==0.22.*'
          extra: '--base ${{ env.QT_MIRROR }}'

      - name: 'Install Qt for android_arm64_v8a'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}
          py7zrversion: '==0.22.*'
          extra: '--base ${{ env.QT_MIRROR }}'

      - name: 'Install Qt for android_armv7'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'android'
          arch: 'android_armv7'
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}
          py7zrversion: '==0.22.*'
          extra: '--base ${{ env.QT_MIRROR }}'

      - name: 'Install Qt for android_x86_64'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'android'
          arch: 'android_x86_64'
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}
          py7zrversion: '==0.22.*'
          extra: '--base ${{ env.QT_MIRROR }}'

      - name: 'Install Qt for android_x86'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'android'
          arch: 'android_x86'
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}
          py7zrversion: '==0.22.*'
          extra: '--base ${{ env.QT_MIRROR }}'

      - name: 'Grant execute permission for qt-cmake'
        run: chmod +x ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/android_x86_64/bin/qt-cmake

      # ── Toolchain ────────────────────────────────────────────────────────────
      - name: 'Setup Java 17'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 'Setup Android NDK r26b'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: 'r26b'

      # ── Source ───────────────────────────────────────────────────────────────
      - name: 'Checkout source'
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 0       # full history so git describe works

      # ── Version ──────────────────────────────────────────────────────────────
      - name: 'Read version from CMakeLists.txt'
        id: get_version
        run: |
          VERSION=$(grep 'set(LENINVPN_VERSION' CMakeLists.txt \
            | sed -E 's/.*LENINVPN_VERSION ([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)\)/\1/')
          TAG="${GITHUB_REF_NAME}"   # e.g. v4.8.15.3
          echo "VERSION=$VERSION"   >> $GITHUB_ENV
          echo "TAG=$TAG"           >> $GITHUB_ENV
          echo "Version: $VERSION  Tag: $TAG"

      # ── Keystore ─────────────────────────────────────────────────────────────
      - name: 'Decode keystore'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android.keystore

      # ── Build ────────────────────────────────────────────────────────────────
      - name: 'Build release APKs + AAB'
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          QT_HOST_PATH: ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/gcc_64
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android.keystore
          ANDROID_KEYSTORE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_KEY_ALIAS }}
          ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_KEY_PASS }}
        run: |
          ./deploy/build_android.sh \
            --aab \
            --apk all \
            --build-platform ${{ env.ANDROID_BUILD_PLATFORM }} \
            --move

      # ── Rename ───────────────────────────────────────────────────────────────
      - name: 'Rename APKs with version'
        run: |
          cd deploy/build
          mv LeninVPN-x86_64-release.apk     LeninVPN_${{ env.VERSION }}_android9+_x86_64.apk
          mv LeninVPN-x86-release.apk         LeninVPN_${{ env.VERSION }}_android9+_x86.apk
          mv LeninVPN-arm64-v8a-release.apk   LeninVPN_${{ env.VERSION }}_android9+_arm64-v8a.apk
          mv LeninVPN-armeabi-v7a-release.apk LeninVPN_${{ env.VERSION }}_android9+_armeabi-v7a.apk
          mv LeninVPN-release.aab             LeninVPN_${{ env.VERSION }}.aab

      # ── Publish ──────────────────────────────────────────────────────────────
      - name: 'Create GitHub Release'
        uses: softprops/action-gh-release@v2
        with:
          name: 'LeninVPN ${{ env.VERSION }}'
          tag_name: ${{ env.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true   # auto-fills changelog from merged PRs
          files: |
            deploy/build/LeninVPN_${{ env.VERSION }}_android9+_arm64-v8a.apk
            deploy/build/LeninVPN_${{ env.VERSION }}_android9+_armeabi-v7a.apk
            deploy/build/LeninVPN_${{ env.VERSION }}_android9+_x86_64.apk
            deploy/build/LeninVPN_${{ env.VERSION }}_android9+_x86.apk
            deploy/build/LeninVPN_${{ env.VERSION }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
